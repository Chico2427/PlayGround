<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131c">
<title>El Juramento de Ceniza</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap');
:root{color-scheme:dark;--gold:#e9bd74;--cream:#f4e9d4;--muted:#a8a6ac}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131c;color:var(--cream);font-family:'DM Sans',sans-serif}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#252a39 0,#12151f 58%,#0b0d13 100%)}.game-shell{position:relative;width:min(100vw,1280px);height:min(100vh,720px);aspect-ratio:16/9;overflow:hidden;background:#111522;box-shadow:0 25px 100px #0009;border:1px solid #ffffff18}.game-shell canvas{display:block;width:100%;height:100%;touch-action:none}.brand{position:absolute;left:25px;top:17px;font:18px 'Marcellus',serif;letter-spacing:1.6px;color:#e8d8ba;text-shadow:0 2px 12px #000}.brand small{display:block;margin-top:3px;font:9px 'DM Sans',sans-serif;letter-spacing:2px;color:#b49e77;text-transform:uppercase}.sound{position:absolute;right:22px;top:20px;border:1px solid #ffffff30;color:#d9c9ad;background:#111720aa;border-radius:20px;padding:7px 12px;font-size:11px;cursor:pointer}.controls-hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.7px;color:#c6c1b6b8;pointer-events:none;white-space:nowrap}.touch-controls{display:none;position:absolute;inset:auto 0 15px;justify-content:space-between;padding:0 18px;pointer-events:none}.touch-group{display:flex;gap:10px;align-items:end}.touch-btn{pointer-events:auto;width:54px;height:54px;border:1px solid #efdfc355;border-radius:50%;background:#151923c9;color:#f4e9d4;font-size:19px;display:grid;place-items:center;touch-action:none;user-select:none;box-shadow:0 4px 14px #0005}.touch-btn.action{width:62px;height:62px;color:#f4cc83;border-color:#e9bd7477}.touch-btn:active{background:#a16f3c88;transform:scale(.94)}@media(max-width:700px){.brand{font-size:14px;left:14px;top:12px}.brand small{font-size:8px}.sound{right:12px;top:12px}.touch-controls{display:flex}.controls-hint{bottom:83px;font-size:9px}.game-shell{width:100vw;height:100dvh;aspect-ratio:auto;border:0}}@media(min-width:701px){.game-shell{height:auto;max-height:100vh}}
</style>
</head>
<body><main class="game-shell"><canvas id="game" aria-label="Juego de plataformas: El Juramento de Ceniza"></canvas><div class="brand">EL JURAMENTO DE CENIZA<small>Crónicas del reino hundido</small></div><button class="sound" id="sound">♫ sonido: apagado</button><div class="controls-hint">MOVER WASD / ← → &nbsp;·&nbsp; SALTAR ESPACIO &nbsp;·&nbsp; GOLPEAR J &nbsp;·&nbsp; MAPA M</div><div class="touch-controls"><div class="touch-group"><button class="touch-btn" data-key="left">◀</button><button class="touch-btn" data-key="right">▶</button></div><div class="touch-group"><button class="touch-btn action" data-key="attack">⚔</button><button class="touch-btn action" data-key="jump">↑</button></div></div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540;
let dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(canvas.clientWidth*dpr);canvas.height=Math.floor(canvas.clientHeight*dpr)}new ResizeObserver(resize).observe(canvas);resize();
const rooms=[{name:'EL UMBRAL',sub:'Santuario de los caídos',tone:'#283647',seen:true},{name:'BOSQUE DE ESPINAS',sub:'Donde duermen las raíces',tone:'#263b37',seen:false},{name:'CRIPTA DEL REY',sub:'La última morada',tone:'#3b2e3b',seen:false}];
const platforms=[[],[{x:210,y:405,w:155},{x:475,y:350,w:145},{x:710,y:410,w:140}],[{x:170,y:408,w:145},{x:405,y:350,w:145},{x:650,y:405,w:165}]];
let room=0,player={x:125,y:430,vx:0,vy:0,w:28,h:44,face:1,onGround:false,health:5,invuln:0,attack:0,attackCooldown:0,airJump:true};let shards=0,mapFound=false,relic=false,altarDone=false,showMap=false,paused=false,dead=false,won=false,notice='',noticeTimer=0,elapsed=0;
const keys={left:false,right:false,jump:false,attack:false};let enemies=[[],[{x:280,y:0,dir:1,hp:2,alive:true,speed:48}],[{x:565,y:0,dir:-1,hp:3,alive:true,speed:37},{x:800,y:0,dir:1,hp:1,alive:true,speed:55}]];
const pickups=[{x:530,y:375,got:false},{x:770,y:435,got:false}];
let particles=[];let audioOn=false,audioCtx=null,lastTime=0;
function say(s){notice=s;noticeTimer=2.8}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function keydown(e){const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='m'&&!e.repeat){showMap=!showMap;return}if(k==='escape'&&!e.repeat){paused=!paused;return}if((k===' '||k==='w'||k==='arrowup')&&!e.repeat){keys.jump=true;jump()}if(k==='j'||k==='x')keys.attack=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if((k==='enter'||k===' ')&&(dead||won)){restart()}}
function keyup(e){let k=e.key.toLowerCase();if(k===' '||k==='w'||k==='arrowup')keys.jump=false;if(k==='j'||k==='x')keys.attack=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false}
addEventListener('keydown',keydown);addEventListener('keyup',keyup);addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.attack=false});
function jump(){if(showMap||paused||dead||won)return;if(player.onGround){player.vy=-485;player.onGround=false;player.airJump=true;sfx(230,.07)}else if(player.airJump){player.vy=-435;player.airJump=false;burst(player.x+14,player.y+26,'#d7c8a9',8);sfx(310,.07)}}
function sfx(freq,dur){if(!audioOn)return;try{audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent='♫ sonido: '+(audioOn?'activado':'apagado');if(audioOn)sfx(440,.1)};
document.querySelectorAll('.touch-btn').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();if(k==='jump')jump();else if(k==='attack')keys.attack=true;else keys[k]=true};const up=e=>{e.preventDefault();if(k==='attack')keys.attack=false;else if(k!=='jump')keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
canvas.addEventListener('pointerdown',e=>{if(showMap){showMap=false;return}if(dead||won){restart();return}if(e.offsetY/canvas.clientHeight>.68){keys.attack=true;setTimeout(()=>keys.attack=false,160)}});
function restart(){room=0;player={x:125,y:430,vx:0,vy:0,w:28,h:44,face:1,onGround:false,health:5,invuln:0,attack:0,attackCooldown:0,airJump:true};shards=0;mapFound=false;relic=false;altarDone=false;showMap=false;paused=false;dead=false;won=false;pickups.forEach(p=>p.got=false);enemies.flat().forEach(e=>{e.alive=true;e.hp=e.x<400?2:3});rooms[1].seen=rooms[2].seen=false;say('El reino aguarda...')}
function floorY(x){let best=480;for(const p of platforms[room])if(x>=p.x&&x<=p.x+p.w&&p.y<best)best=p.y;return best}
function burst(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:(Math.random()-.7)*170,life:.35+Math.random()*.55,color:c,size:2+Math.random()*3})}
function update(dt){if(paused||showMap||dead||won)return;elapsed+=dt;if(noticeTimer>0)noticeTimer-=dt;player.invuln=Math.max(0,player.invuln-dt);player.attackCooldown=Math.max(0,player.attackCooldown-dt);player.attack=Math.max(0,player.attack-dt);
let move=(keys.right?1:0)-(keys.left?1:0);if(move){player.vx+=move*1850*dt;player.face=move}else player.vx*=Math.pow(.001,dt);player.vx=clamp(player.vx,-210,210);
if(keys.attack&&player.attackCooldown<=0){player.attack=.22;player.attackCooldown=.36;sfx(150,.08);for(let e of enemies[room])if(e.alive&&Math.abs((e.x+16)-(player.x+14+player.face*36))<50&&Math.abs(e.y-player.y)<60){e.hp--;burst(e.x+16,e.y+20,'#ffc779',8);if(e.hp<=0){e.alive=false;shards++;say('Fragmento de alma recogido');sfx(520,.15)}}}
let oldY=player.y;player.x+=player.vx*dt;player.x=clamp(player.x,-5,932);player.vy+=1250*dt;player.y+=player.vy*dt;player.onGround=false;let foot=player.y+player.h;
if(player.vy>=0){let land=480;for(const p of platforms[room])if(oldY+player.h<=p.y+3&&foot>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w)land=Math.min(land,p.y);if(foot>=land){player.y=land-player.h;player.vy=0;player.onGround=true;player.airJump=true}}
if(player.y>H+40){player.health=0;dead=true}
if(room===0&&player.x<2&&player.y+player.h>=445){player.x=910;room=1;rooms[1].seen=true;say('Bosque de espinas · mapa descubierto');}
else if(room===1&&player.x>925&&player.y+player.h>=445){player.x=8;room=2;rooms[2].seen=true;say('Cripta del rey · zona descubierta');}
else if(room===1&&player.x<2&&player.y+player.h>=445){player.x=910;room=0;say('Has regresado al santuario')}
else if(room===2&&player.x>932&&player.y+player.h>=445){player.x=8;room=1;say('Has regresado al bosque')}
for(let p of pickups){if(p.got)continue;if((p.x>200&&room===1)||(p.x>600&&room===2)){if(Math.abs(player.x+14-p.x)<30&&Math.abs(player.y+22-p.y)<42){p.got=true;if(room===1){mapFound=true;shards++;say('¡Mapa antiguo obtenido! Pulsa M para verlo');sfx(620,.25)}else{relic=true;say('Reliquia real obtenida · vuelve al altar');sfx(710,.3)}}}}
for(let e of enemies[room])if(e.alive){let y=floorY(e.x+15)-38;e.y=y;e.x+=e.dir*e.speed*dt;if(e.x<85||e.x>860)e.dir*=-1;if(player.invuln<=0&&Math.abs((player.x+14)-(e.x+15))<33&&Math.abs(player.y-e.y)<35){player.health--;player.invuln=1.05;player.vx=-player.face*220;player.vy=-220;burst(player.x+14,player.y+20,'#d76568',8);say('¡Cuidado!');sfx(95,.2);if(player.health<=0)dead=true}}
if(room===0&&relic&&player.x<190&&player.x>70&&player.y+player.h>=460&&!altarDone){altarDone=true;won=true;sfx(880,.5)}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawBackground(){let gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rooms[room].tone);gr.addColorStop(.62,'#171c27');gr.addColorStop(1,'#11141c');rect(0,0,W,H,gr);
// distant haze + moon
let moon=ctx.createRadialGradient(746,104,4,746,104,112);moon.addColorStop(0,'#e4c99042');moon.addColorStop(1,'#e4c99000');rect(625,0,240,230,moon);ctx.fillStyle='#ddc89b99';ctx.beginPath();ctx.arc(746,104,22,0,Math.PI*2);ctx.fill();
// mountain silhouettes
for(let layer=0;layer<3;layer++){ctx.fillStyle=['#151c25aa','#121923d9','#10151e'][layer];ctx.beginPath();ctx.moveTo(0,350+layer*30);for(let x=0;x<=W;x+=80){let yy=300+layer*38+Math.sin(x*.012+layer*3)*38+Math.cos(x*.023)*20;ctx.lineTo(x,yy)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
// gothic columns and arches
for(let i=0;i<8;i++){let x=i*150-30;ctx.fillStyle='#0b1018aa';ctx.fillRect(x,175+(i%3)*20,27,310);ctx.fillRect(x-13,175+(i%3)*20,53,12);ctx.fillRect(x-8,470,43,14);ctx.beginPath();ctx.arc(x+14,175+(i%3)*20,28,Math.PI,0);ctx.fill();}
// drifting motes
for(let i=0;i<32;i++){let x=((i*137+elapsed*(8+i%4)*6)%1020)-30,y=(i*83+Math.sin(elapsed*.6+i)*22)%390+30;ctx.fillStyle=i%4===0?'#d8bd8466':'#b8d5c544';ctx.fillRect(x,y,2,2)}
}
function drawPlatforms(){// ground
let grd=ctx.createLinearGradient(0,480,0,540);grd.addColorStop(0,'#494744');grd.addColorStop(.18,'#292a2d');grd.addColorStop(1,'#17191f');rect(0,480,W,60,grd);line(0,480,W,480,'#a3947b',2);
for(let x=0;x<W;x+=48){rect(x+3,487,35,3,'#69615a');line(x+5,493,x+31,493,'#11151b',2)}
for(const p of platforms[room]){let g=ctx.createLinearGradient(0,p.y,0,p.y+18);g.addColorStop(0,'#777064');g.addColorStop(1,'#33343a');rect(p.x,p.y,p.w,17,g);line(p.x,p.y,p.x+p.w,p.y,'#c0ab82',2);for(let x=p.x+12;x<p.x+p.w;x+=33){line(x,p.y+5,x-6,p.y+15,'#272b31',2);rect(x+6,p.y+3,2,2,'#b3a78d')}}
// doorway thresholds
for(let i=0;i<2;i++){let x=i===0?0:915;if((room===0&&i===0)||(room===1)||(room===2&&i===1)){ctx.fillStyle='#c2a15d';ctx.globalAlpha=.24+Math.sin(elapsed*3)*.07;ctx.fillRect(x,405,45,75);ctx.globalAlpha=1;for(let j=0;j<4;j++)line(x+j*12,414,x+j*12,480,'#d8bd8466',2)}}
}
function drawDecor(){// foreground grave stones, vines, candles
for(let i=0;i<11;i++){let x=i*101+28;let h=14+(i*29%25);ctx.fillStyle='#25262a';ctx.fillRect(x,480-h,15,h);ctx.beginPath();ctx.arc(x+7.5,480-h,7.5,Math.PI,0);ctx.fill();line(x+4,470-h,x+11,470-h,'#9b8b6d66')}
for(let i=0;i<6;i++){let x=88+i*157;ctx.fillStyle='#d2a56b';ctx.fillRect(x,462,3,14);let glow=ctx.createRadialGradient(x+1,461,0,x+1,461,19);glow.addColorStop(0,'#ffb96377');glow.addColorStop(1,'#ffb96300');rect(x-18,442,38,38,glow);ctx.fillStyle='#ffe2a6';ctx.beginPath();ctx.ellipse(x+1,460,2,5,0,0,Math.PI*2);ctx.fill()}}
function drawPickup(){if(room===1&&!pickups[0].got){let p=pickups[0];drawGlow(p.x,p.y,18,'#8bd3b6');ctx.save();ctx.translate(p.x,p.y+Math.sin(elapsed*3)*5);ctx.rotate(Math.sin(elapsed*2)*.08);ctx.fillStyle='#9de0c5';ctx.fillRect(-10,-13,20,27);ctx.fillStyle='#314b48';ctx.fillRect(-6,-9,12,17);line(-5,-5,5,3,'#b8f1d7',2);line(5,-5,-5,3,'#b8f1d7',2);ctx.restore()}
if(room===2&&!pickups[1].got){let p=pickups[1];drawGlow(p.x,p.y,27,'#f2c466');ctx.save();ctx.translate(p.x,p.y+Math.sin(elapsed*2.7)*5);ctx.rotate(Math.PI/4);rect(-10,-10,20,20,'#f1cb75');rect(-5,-5,10,10,'#fff0bd');ctx.restore();ctx.fillStyle='#e6c777';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('RELIQUIA',p.x,p.y+32)}
if(room===0){drawGlow(125,451,24,relic?'#f1c36d':'#92a7a5');ctx.fillStyle='#373b3a';ctx.beginPath();ctx.moveTo(96,480);ctx.lineTo(101,444);ctx.lineTo(125,429);ctx.lineTo(149,444);ctx.lineTo(154,480);ctx.fill();ctx.strokeStyle='#a39374';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=relic?'#f2d17e':'#8ca7a1';ctx.beginPath();ctx.arc(125,451,6,0,Math.PI*2);ctx.fill();ctx.textAlign='center';ctx.font='9px sans-serif';ctx.fillStyle='#d6c6a5';ctx.fillText(relic?'OFRECE LA RELIQUIA':'ALTAR',125,420)}}
function drawGlow(x,y,r,c){let g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,c+'bb');g.addColorStop(1,c+'00');rect(x-r,y-r,r*2,r*2,g)}
function drawEnemies(){for(const e of enemies[room])if(e.alive){ctx.save();ctx.translate(e.x+15,e.y+18);if(e.dir<0)ctx.scale(-1,1);drawGlow(0,0,27,'#cb6261');ctx.fillStyle='#29262a';ctx.beginPath();ctx.moveTo(-14,15);ctx.lineTo(-13,-3);ctx.lineTo(-8,-15);ctx.lineTo(-3,-8);ctx.lineTo(2,-17);ctx.lineTo(8,-7);ctx.lineTo(14,-12);ctx.lineTo(13,15);ctx.closePath();ctx.fill();ctx.fillStyle='#d85f5b';ctx.fillRect(4,-4,4,3);ctx.fillStyle='#a99a7c';ctx.fillRect(-14,13,28,5);ctx.restore()}}
function drawPlayer(){ctx.save();if(player.invuln>0&&Math.floor(elapsed*17)%2)ctx.globalAlpha=.4;let x=player.x,y=player.y;ctx.translate(x+14,y+23);if(player.face<0)ctx.scale(-1,1);
// cloak
ctx.fillStyle='#22252b';ctx.beginPath();ctx.moveTo(-8,-7);ctx.lineTo(-14,14);ctx.lineTo(-9,20);ctx.lineTo(8,19);ctx.lineTo(11,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#39383b';ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(-10,14);ctx.lineTo(-2,17);ctx.lineTo(3,-7);ctx.fill();
// helmet
ctx.fillStyle='#e5dfd1';ctx.beginPath();ctx.moveTo(-10,-11);ctx.lineTo(-9,-25);ctx.lineTo(-4,-30);ctx.lineTo(4,-29);ctx.lineTo(10,-22);ctx.lineTo(8,-10);ctx.lineTo(0,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#b9b1a3';ctx.fillRect(-7,-23,14,9);ctx.fillStyle='#252a31';ctx.fillRect(-5,-19,10,3);ctx.fillStyle='#e9bd74';ctx.fillRect(2,-19,3,2);ctx.fillStyle='#d8d1c5';ctx.beginPath();ctx.moveTo(-3,-29);ctx.lineTo(-12,-38);ctx.lineTo(-8,-25);ctx.fill();ctx.beginPath();ctx.moveTo(3,-29);ctx.lineTo(12,-38);ctx.lineTo(8,-24);ctx.fill();
// sword arm
ctx.strokeStyle='#d3ccbd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(5,-6);ctx.lineTo(10,4);ctx.stroke();let sx=player.attack>0?16:12,sy=player.attack>0?-8:7;ctx.strokeStyle='#dce2df';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+18,sy-13);ctx.stroke();ctx.strokeStyle='#c49b58';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx-3,sy+3);ctx.lineTo(sx+4,sy-2);ctx.stroke();if(player.attack>0){ctx.strokeStyle='#e9dfc566';ctx.lineWidth=9;ctx.beginPath();ctx.arc(8,-1,29,-1.2,.65);ctx.stroke()}ctx.restore()}
function drawHUD(){// top left health and shards
for(let i=0;i<5;i++){let x=28+i*26,y=82;drawHeart(x,y,player.health>i?'#dd7773':'#4a4145')}
ctx.textAlign='left';ctx.font='bold 11px "DM Sans"';ctx.fillStyle='#e6d9c4';ctx.fillText('VIDA',27,105);ctx.fillStyle='#dfca9e';ctx.font='12px "DM Sans"';ctx.fillText('✦ '+shards+' fragment'+(shards===1?'o':'os'),28,126);
// room label
ctx.textAlign='right';ctx.fillStyle='#e7d9bd';ctx.font='15px Marcellus,serif';ctx.fillText(rooms[room].name,W-28,83);ctx.fillStyle='#a8a39c';ctx.font='10px "DM Sans"';ctx.fillText(rooms[room].sub,W-28,101);
// objective ribbon
let objective=altarDone?'JURAMENTO CUMPLIDO':relic?'REGRESA AL ALTAR':'BUSCA LA RELIQUIA';ctx.textAlign='center';ctx.font='10px "DM Sans"';ctx.fillStyle='#d4c5a5';ctx.fillText(objective,W/2,36);
// map prompt
ctx.textAlign='right';ctx.fillStyle=mapFound?'#c9e6d4':'#aca99f';ctx.font='10px "DM Sans"';ctx.fillText(mapFound?'[ M ]  MAPA':'[ M ]  MAPA SELLADO',W-25,125);
}
function drawHeart(x,y,color){ctx.save();ctx.translate(x,y);ctx.scale(.72,.72);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,9);ctx.bezierCurveTo(-20,-2,-10,-14,0,-6);ctx.bezierCurveTo(10,-14,20,-2,0,9);ctx.fill();ctx.restore()}
function overlay(title,subtitle,button){rect(0,0,W,H,'#0b0d13bb');ctx.textAlign='center';ctx.fillStyle='#e9bd74';ctx.font='11px "DM Sans"';ctx.fillText('✧  CRÓNICAS DEL REINO HUNDIDO  ✧',W/2,190);ctx.fillStyle='#f1e7d3';ctx.font='42px Marcellus,serif';ctx.fillText(title,W/2,247);ctx.fillStyle='#c3b9a8';ctx.font='15px "DM Sans"';ctx.fillText(subtitle,W/2,282);ctx.fillStyle='#e9bd74';ctx.font='bold 12px "DM Sans"';ctx.fillText(button,W/2,340);ctx.fillStyle='#8c8a88';ctx.font='10px "DM Sans"';ctx.fillText('WASD / FLECHAS para moverte · ESPACIO para saltar · J para atacar',W/2,390)}
function drawMap(){rect(0,0,W,H,'#090c12d9');ctx.textAlign='center';ctx.fillStyle='#e9bd74';ctx.font='11px "DM Sans"';ctx.fillText('CARTOGRAFÍA RECUPERADA',W/2,105);ctx.fillStyle='#f0e5d1';ctx.font='34px Marcellus,serif';ctx.fillText('El reino hundido',W/2,147);ctx.fillStyle='#a39d92';ctx.font='12px "DM Sans"';ctx.fillText('Explora las sendas olvidadas. Los lugares nuevos se revelan al llegar.',W/2,176);
let xs=[230,480,730],y=300;line(xs[0]+45,y,xs[1]-45,y,'#8d8064',3);line(xs[1]+45,y,xs[2]-45,y,'#8d806455',3);for(let i=0;i<3;i++){let seen=rooms[i].seen;let fill=seen?(i===room?'#e4bd76':'#536b62'):'#272b31';ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(xs[i]-57,y-40,114,80,10);ctx.fill();ctx.strokeStyle=seen?'#dcc391':'#46474a';ctx.lineWidth=1;ctx.stroke();ctx.textAlign='center';ctx.fillStyle=seen?'#f4ead7':'#6d6c6b';ctx.font='11px "DM Sans"';ctx.fillText(seen?rooms[i].name:'???',xs[i],y+3);ctx.fillStyle=seen?'#c4b8a2':'#555';ctx.font='9px "DM Sans"';ctx.fillText(seen?rooms[i].sub:'Sin explorar',xs[i],y+20);if(i===room){ctx.fillStyle='#fff0c8';ctx.font='9px "DM Sans"';ctx.fillText('TÚ ESTÁS AQUÍ',xs[i],y-52)}}
ctx.fillStyle='#d2c4ac';ctx.font='11px "DM Sans"';ctx.fillText('Reliquia '+(relic?'✓':'○')+'     ·     Altar '+(altarDone?'✓':'○'),W/2,395);ctx.fillStyle='#a79d8d';ctx.fillText('Pulsa M o toca la pantalla para volver',W/2,443)}
function render(){let sx=canvas.width/W,sy=canvas.height/H;ctx.setTransform(sx,0,0,sy,0,0);drawBackground();drawPlatforms();drawDecor();drawPickup();drawEnemies();drawPlayer();for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;drawHUD();if(noticeTimer>0&&!showMap){ctx.globalAlpha=Math.min(1,noticeTimer*2);ctx.fillStyle='#10141de8';ctx.beginPath();ctx.roundRect(W/2-210,126,420,34,8);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#e8d7b6';ctx.font='12px "DM Sans"';ctx.fillText(notice,W/2,148);ctx.globalAlpha=1}if(showMap)drawMap();if(paused)overlay('Pausa','El silencio también forma parte del viaje.','PULSA ESC PARA CONTINUAR');if(dead)overlay('Has caído','La oscuridad reclama al caballero, pero no al juramento.','PULSA ENTER O TOCA PARA VOLVER A INTENTAR');if(won)overlay('Juramento cumplido','La reliquia descansa. El reino vuelve a recordar.','PULSA ENTER O TOCA PARA JUGAR DE NUEVO')}
function loop(t){let dt=Math.min(.033,(t-lastTime)/1000||0);lastTime=t;update(dt);render();requestAnimationFrame(loop)}
rooms[0].seen=true;say('Encuentra la reliquia perdida');requestAnimationFrame(loop);
})();
