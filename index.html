<body><main class="game-shell"><canvas id="game" aria-label="Juego de plataformas: El Juramento de Ceniza"></canvas><div class="brand">EL JURAMENTO DE CENIZA<small>Crónicas del reino hundido</small></div><button class="sound" id="sound">♫ sonido: apagado</button><div class="controls-hint">MOVER WASD / ← → &nbsp;·&nbsp; SALTAR ESPACIO &nbsp;·&nbsp; GOLPEAR J &nbsp;·&nbsp; ARMAS Q &nbsp;·&nbsp; COFRES: E / TOCA EL BOTÓN</div><div class="touch-controls"><div class="touch-group"><button class="touch-btn" data-key="left">◀</button><button class="touch-btn" data-key="right">▶</button></div><div class="touch-group actions"><button class="touch-btn utility" data-key="map" aria-label="Abrir mapa">⌖</button><button class="touch-btn utility" data-key="weapon" aria-label="Cambiar arma">Q</button><button class="touch-btn utility" data-key="pause" aria-label="Pausar">Ⅱ</button><button class="touch-btn utility" data-key="interact" aria-label="Abrir cofre">E</button><button class="touch-btn action" data-key="attack" aria-label="Atacar">⚔</button><button class="touch-btn action" data-key="jump" aria-label="Saltar">↑</button></div></div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540;
let dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(canvas.clientWidth*dpr);canvas.height=Math.floor(canvas.clientHeight*dpr)}new ResizeObserver(resize).observe(canvas);resize();
const rooms=[{name:'EL UMBRAL',sub:'Santuario de los caídos',tone:'#283647',seen:true},{name:'BOSQUE DE ESPINAS',sub:'Donde duermen las raíces',tone:'#263b37',seen:false},{name:'CRIPTA DEL REY',sub:'La última morada',tone:'#3b2e3b',seen:false}];
const platforms=[[],[{x:210,y:405,w:155},{x:475,y:350,w:145},{x:710,y:410,w:140}],[{x:170,y:408,w:145},{x:405,y:350,w:145},{x:650,y:405,w:165}]];
let room=0,player={x:125,y:430,vx:0,vy:0,w:28,h:44,face:1,onGround:false,health:5,invuln:0,attack:0,attackCooldown:0,airJump:true};let shards=0,mapFound=false,relic=false,altarDone=false,showMap=false,paused=false,dead=false,won=false,notice='',noticeTimer=0,elapsed=0;
const weapons=[{name:'Espada',damage:1,range:66,cooldown:.36,color:'#e6e9e5'},{name:'Hacha',damage:2,range:55,cooldown:.58,color:'#e2ad66'},{name:'Lanza',damage:1,range:78,cooldown:.28,color:'#a9d2c4'}];let ownedWeapons=[0],weaponIndex=0;
const chests=[{room:1,x:390,weapon:1,open:false},{room:2,x:610,weapon:2,open:false}];

const keys={left:false,right:false,jump:false,attack:false};let enemies=[[{x:430,y:0,dir:1,hp:2,maxHp:2,alive:true,speed:32,kind:'slime'},{x:710,y:0,dir:-1,hp:3,maxHp:3,alive:true,speed:24,kind:'skeleton'}],[{x:275,y:0,dir:1,hp:2,maxHp:2,alive:true,speed:48,kind:'slime'},{x:580,y:0,dir:-1,hp:3,maxHp:3,alive:true,speed:30,kind:'zombie'},{x:805,y:0,dir:-1,hp:2,maxHp:2,alive:true,speed:40,kind:'skeleton'},{x:690,y:0,dir:-1,hp:3,maxHp:3,alive:true,speed:62,kind:'mercenary',stealCooldown:0}],[{x:330,y:0,dir:1,hp:2,maxHp:2,alive:true,speed:48,kind:'slime'},{x:565,y:0,dir:-1,hp:3,maxHp:3,alive:true,speed:37,kind:'skeleton'},{x:790,y:0,dir:1,hp:4,maxHp:4,alive:true,speed:25,kind:'zombie'},{x:470,y:0,dir:1,hp:4,maxHp:4,alive:true,speed:72,kind:'mercenary',stealCooldown:0}]];

let particles=[];let audioOn=false,audioCtx=null,lastTime=0;
function say(s){notice=s;noticeTimer=2.8}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function keydown(e){const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='m'&&!e.repeat){showMap=!showMap;return}if(k==='escape'&&!e.repeat){paused=!paused;return}if(k==='q'&&!e.repeat&&ownedWeapons.length>1){weaponIndex=(weaponIndex+1)%ownedWeapons.length;say('Arma equipada: '+weapons[ownedWeapons[weaponIndex]].name);return}if(k==='e'&&!e.repeat){interact();return}if((k===' '||k==='w'||k==='arrowup')&&!e.repeat){keys.jump=true;jump()}if(k==='j'||k==='x')keys.attack=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if((k==='enter'||k===' ')&&(dead||won)){restart()}}
function keyup(e){let k=e.key.toLowerCase();if(k===' '||k==='w'||k==='arrowup')keys.jump=false;if(k==='j'||k==='x')keys.attack=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false}
addEventListener('keydown',keydown);addEventListener('keyup',keyup);addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.attack=false});
function jump(){if(showMap||paused||dead||won)return;if(player.onGround){player.vy=-485;player.onGround=false;player.airJump=true;sfx(230,.07)}else if(player.airJump){player.vy=-435;player.airJump=false;burst(player.x+14,player.y+26,'#d7c8a9',8);sfx(310,.07)}}
function interact(){if(showMap||paused||dead||won)return;let chest=chests.find(c=>c.room===room&&!c.open&&player.onGround&&Math.abs(player.x+14-c.x)<52);if(!chest){say('Acércate a un cofre para abrirlo');return}chest.open=true;if(!ownedWeapons.includes(chest.weapon))ownedWeapons.push(chest.weapon);weaponIndex=ownedWeapons.indexOf(chest.weapon);say('¡Cofre abierto! '+weapons[chest.weapon].name+' equipada · Q cambia de arma');burst(chest.x,455,'#edc16e',14);sfx(740,.28)}
function sfx(freq,dur){if(!audioOn)return;try{audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent='♫ sonido: '+(audioOn?'activado':'apagado');if(audioOn)sfx(440,.1)};
document.querySelectorAll('.touch-btn').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();if(k==='jump')jump();else if(k==='attack')keys.attack=true;else if(k==='map')showMap=!showMap;else if(k==='pause')paused=!paused;else if(k==='interact')interact();else if(k==='weapon'&&ownedWeapons.length>1){weaponIndex=(weaponIndex+1)%ownedWeapons.length;say('Arma equipada: '+weapons[ownedWeapons[weaponIndex]].name)}else keys[k]=true;b.classList.add('pressed')};const up=e=>{e.preventDefault();b.classList.remove('pressed');if(k==='attack')keys.attack=false;else if(k!=='jump'&&k!=='map'&&k!=='pause'&&k!=='weapon'&&k!=='interact')keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
canvas.addEventListener('pointerdown',e=>{if(showMap){showMap=false;return}if(dead||won){restart();return}if(e.offsetY/canvas.clientHeight>.68){keys.attack=true;setTimeout(()=>keys.attack=false,160)}});
function restart(){room=0;player={x:125,y:430,vx:0,vy:0,w:28,h:44,face:1,onGround:false,health:5,invuln:0,attack:0,attackCooldown:0,airJump:true};shards=0;mapFound=false;relic=false;altarDone=false;showMap=false;paused=false;dead=false;won=false;ownedWeapons=[0];weaponIndex=0;chests.forEach(c=>c.open=false);pickups.forEach(p=>p.got=false);enemies.flat().forEach(e=>{e.alive=true;e.hp=e.maxHp;e.stealCooldown=0});bosses.slice(1).forEach(b=>{b.alive=true;b.hp=b.maxHp;b.attackCooldown=0});rooms[1].seen=rooms[2].seen=false;say('El reino aguarda...')}
function floorY(x){let best=480;for(const p of platforms[room])if(x>=p.x&&x<=p.x+p.w&&p.y<best)best=p.y;return best}
function burst(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:(Math.random()-.7)*170,life:.35+Math.random()*.55,color:c,size:2+Math.random()*3})}
function update(dt){if(paused||showMap||dead||won)return;elapsed+=dt;if(noticeTimer>0)noticeTimer-=dt;player.invuln=Math.max(0,player.invuln-dt);player.attackCooldown=Math.max(0,player.attackCooldown-dt);player.attack=Math.max(0,player.attack-dt);
let move=(keys.right?1:0)-(keys.left?1:0);if(move){player.vx+=move*1850*dt;player.face=move}else player.vx*=Math.pow(.001,dt);player.vx=clamp(player.vx,-210,210);
if(keys.attack&&player.attackCooldown<=0){let weapon=weapons[ownedWeapons[weaponIndex]];player.attack=.28;player.attackCooldown=weapon.cooldown;sfx(weaponIndex===1?110:weaponIndex===2?260:150,.08);for(let e of enemies[room])if(e.alive){let dx=(e.x+16)-(player.x+14);if(dx*player.face>0&&Math.abs(dx)<weapon.range&&Math.abs(e.y-player.y)<60){e.hp-=weapon.damage;e.hit=.18;burst(e.x+16,e.y+20,weapon.color,weaponIndex===1?13:9);if(e.hp<=0){e.alive=false;shards++;say('Fragmento de alma recogido');sfx(520,.15)}}}const boss=bosses[room];if(boss&&boss.alive){let dx=boss.x-(player.x+14);if(dx*player.face>0&&Math.abs(dx)<weapon.range+10&&Math.abs(boss.y-player.y)<95){boss.hp-=weapon.damage;boss.hit=.2;burst(boss.x,boss.y+45,weapon.color,weaponIndex===1?16:11);if(boss.hp<=0){boss.alive=false;shards+=3;say('¡Jefe derrotado! Tres fragmentos de alma obtenidos');sfx(520,.35)}}}}
let oldY=player.y;player.x+=player.vx*dt;player.x=clamp(player.x,-5,932);player.vy+=1250*dt;player.y+=player.vy*dt;player.onGround=false;let foot=player.y+player.h;
if(player.vy>=0){let land=480;for(const p of platforms[room])if(oldY+player.h<=p.y+3&&foot>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w)land=Math.min(land,p.y);if(foot>=land){player.y=land-player.h;player.vy=0;player.onGround=true;player.airJump=true}}
if(player.y>H+40){player.health=0;dead=true}
if(room===0&&player.x<2&&player.y+player.h>=445){player.x=910;room=1;rooms[1].seen=true;say('Bosque de espinas · mapa descubierto');}
else if(room===1&&player.x>925&&player.y+player.h>=445){player.x=8;room=2;rooms[2].seen=true;say('Cripta del rey · zona descubierta');}
else if(room===1&&player.x<2&&player.y+player.h>=445){player.x=910;room=0;say('Has regresado al santuario')}
else if(room===2&&player.x>932&&player.y+player.h>=445){player.x=8;room=1;say('Has regresado al bosque')}
for(let p of pickups){if(p.got)continue;if((p.x>200&&room===1)||(p.x>600&&room===2)){if(Math.abs(player.x+14-p.x)<30&&Math.abs(player.y+22-p.y)<42){p.got=true;if(room===1){mapFound=true;shards++;say('¡Mapa antiguo obtenido! Pulsa M para verlo');sfx(620,.25)}else{relic=true;say('Reliquia real obtenida · vuelve al altar');sfx(710,.3)}}}}

for(let e of enemies[room])if(e.alive){e.hit=Math.max(0,(e.hit||0)-dt);let y=floorY(e.x+15)-38;e.y=y;if(e.kind==='mercenary'){let dx=(player.x+14)-(e.x+15);if(Math.abs(dx)<230)e.dir=dx<0?-1:1;e.x+=e.dir*(Math.abs(dx)<230?e.speed:e.speed*.42)*dt;e.stealCooldown=Math.max(0,(e.stealCooldown||0)-dt)}else e.x+=e.dir*e.speed*dt;if(e.x<85||e.x>860)e.dir*=-1;if(player.invuln<=0&&Math.abs((player.x+14)-(e.x+15))<33&&Math.abs(player.y-e.y)<35){player.health--;player.invuln=1.05;player.vx=-player.face*220;player.vy=-220;burst(player.x+14,player.y+20,'#d76568',8);if(e.kind==='mercenary'&&e.stealCooldown<=0){if(shards>0){shards--;say('¡El mercenario te robó un fragmento!')}else say('¡El mercenario intenta robarte!');e.stealCooldown=3.5}else say('¡Cuidado!');sfx(95,.2);if(player.health<=0)dead=true}}
const boss=bosses[room];if(boss&&boss.alive){boss.hit=Math.max(0,(boss.hit||0)-dt);boss.attackCooldown=Math.max(0,boss.attackCooldown-dt);boss.y=floorY(boss.x)-78;let dx=(player.x+14)-boss.x;if(Math.abs(dx)<340)boss.dir=dx<0?-1:1;boss.x+=boss.dir*(Math.abs(dx)<340?boss.speed:boss.speed*.35)*dt;boss.x=clamp(boss.x,95,890);if(player.invuln<=0&&Math.abs(dx)<53&&Math.abs(player.y-boss.y)<90&&boss.attackCooldown<=0){boss.attackCooldown=1.15;player.health--;player.invuln=1.05;player.vx=-player.face*260;player.vy=-250;burst(player.x+14,player.y+20,'#d76568',12);say(boss.kind==='thorn'?'¡El Guardián de Espinas te golpea!':'¡El Rey de Ceniza te golpea!');sfx(82,.24);if(player.health<=0)dead=true}}
if(room===0&&relic&&player.x<190&&player.x>70&&player.y+player.h>=460&&!altarDone){altarDone=true;won=true;sfx(880,.5)}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawBackground(){
 let gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rooms[room].tone);gr.addColorStop(.58,room===1?'#182a29':'#171c27');gr.addColorStop(1,'#11141c');rect(0,0,W,H,gr);
 // Moonlight, layered mist and distant hills
 let moon=ctx.createRadialGradient(746,104,4,746,104,132);moon.addColorStop(0,room===1?'#b8d5aa55':'#e4c99055');moon.addColorStop(1,'#e4c99000');rect(600,0,300,245,moon);
 ctx.fillStyle=room===1?'#d5e0bb99':'#ddc89ba8';ctx.beginPath();ctx.arc(746,104,22,0,Math.PI*2);ctx.fill();
 for(let layer=0;layer<3;layer++){ctx.fillStyle=['#26313a55','#18222be0','#111720'][layer];ctx.beginPath();ctx.moveTo(0,350+layer*25);for(let x=0;x<=W;x+=55){let yy=292+layer*36+Math.sin(x*.012+layer*3)*35+Math.cos(x*.023)*18;ctx.lineTo(x,yy)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
 if(room===1)drawForestSilhouette();else drawCastleSilhouette();
 // Massive near arches, ribbed stone piers and carved capitals frame the play space
 for(let i=0;i<7;i++){let x=i*174-42,top=148+(i%3)*12;ctx.fillStyle='#0b1018bd';ctx.fillRect(x,top+24,29,334);ctx.fillRect(x-13,top+18,55,13);ctx.fillRect(x-8,456,45,19);ctx.beginPath();ctx.arc(x+14,top+24,29,Math.PI,0);ctx.fill();
 ctx.fillStyle='#30333a66';ctx.fillRect(x+5,top+43,3,300);ctx.fillRect(x+19,top+43,2,300);ctx.fillStyle='#11151dcc';ctx.fillRect(x-3,top+35,35,3);
 }
 // Motes and drifting ash
 for(let i=0;i<38;i++){let x=((i*137+elapsed*(8+i%4)*6)%1020)-30,y=(i*83+Math.sin(elapsed*.6+i)*22)%390+30;ctx.fillStyle=i%4===0?'#e7c98a77':room===1?'#b6d7a866':'#b8d5c544';ctx.fillRect(x,y,2,2)}
}
function drawCastleSilhouette(){
 const far='#111822b8',mid=room===2?'#17151f':'#141b25';
 // distant curtain wall and clustered roofs
 ctx.fillStyle=far;ctx.fillRect(40,284,880,126);
 for(let i=0;i<14;i++){let x=40+i*66;ctx.fillRect(x,270+(i%3)*9,42,18);for(let j=0;j<3;j++)ctx.fillRect(x+j*14,259+(i%3)*9,7,12)}
 // broad keep with sloped gothic roof
 drawTower(324,370,310,176,mid,'#d7aa6d');
 drawTower(215,370,95,118,far,'#b9895f');drawTower(648,370,100,138,far,'#b9895f');
 // slender roof spires, cross finials, tiny warm windows
 for(let i=0;i<5;i++){let x=269+i*105,base=292+(i%2)*18;ctx.fillStyle='#0c121a';ctx.fillRect(x-11,base,22,78);ctx.beginPath();ctx.moveTo(x-20,base);ctx.lineTo(x,base-40);ctx.lineTo(x+20,base);ctx.closePath();ctx.fill();line(x,base-49,x,base-36,'#c4a87888',2);line(x-5,base-45,x+5,base-45,'#c4a87888',1);ctx.fillStyle='#dca96c88';ctx.fillRect(x-3,base+22,6,12);}
 // broken battlement silhouette around the keep
 ctx.fillStyle='#121821';ctx.fillRect(300,365,360,12);for(let x=307;x<660;x+=26)ctx.fillRect(x,353,13,16);
}
function drawTower(x,base,w,h,color,light){
 ctx.fillStyle=color;ctx.fillRect(x,base-h,w,h);ctx.fillRect(x-8,base-h+14,w+16,10);ctx.fillRect(x-12,base-9,w+24,12);
